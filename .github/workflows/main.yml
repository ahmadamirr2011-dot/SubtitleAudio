name: Build Subtitle Audio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Audio-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14name: Build Subtitle Audio for Windows

